[project]
name = "laya-serve"
version = "0.2.0"
description = "A slim HTTP wrapper around Laya so remote apps can call it over the network"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "laya>=0.3.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # starlette's TestClient wants httpx2; plain httpx is deprecated there.
    "httpx2>=2.13",
]

[project.scripts]
laya-serve = "laya_serve.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Warnings fail the build, so a new deprecation can't accumulate unnoticed.
# Each ignore names the dependency it's waiting on.
filterwarnings = [
    "error",
    # starlette 1.6.0 uses an anyio alias deprecated in anyio 4.15.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_serve"]
