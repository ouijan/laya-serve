[project]
name = "laya-serve"
version = "0.1.0"
description = "A slim HTTP wrapper around Laya so remote apps can call it over the network"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "laya>=0.3.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.scripts]
laya-serve = "laya_serve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_serve"]
