name: Publish client

# One tag ships both artefacts: `git tag v0.1.1 && git push --tags` publishes
# ghcr.io/ouijan/laya-serve:0.1.1 from CI and @ouijan/laya-client@0.1.1 here,
# so a consumer can pin the image and the client to the same number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: clients/typescript
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      # setup-node only for the registry auth it writes into .npmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@ouijan"

      # A tag that disagrees with package.json would publish the wrong
      # version under the right-looking tag. Fail instead.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || {
            echo "tag $GITHUB_REF_NAME does not match package.json $pkg"
            exit 1
          }

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run compile

      # npm rather than bun: bun publish does not read setup-node's .npmrc.
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Packages requires a token even for public packages, so the
      # public registry is what makes `npm add` work with no setup. Skipped
      # until NPM_TOKEN exists, rather than failing the release.
      - uses: actions/setup-node@v4
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@ouijan"

      - name: Publish to npmjs
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
