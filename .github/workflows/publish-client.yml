name: Publish client

# One tag ships both artefacts: `git tag v0.1.1 && git push --tags` publishes
# ghcr.io/ouijan/laya-serve:0.1.1 from CI and @ouijan/laya-client@0.1.1 here,
# so a consumer can pin the image and the client to the same number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # OIDC for npm trusted publishing: no NPM_TOKEN anywhere.
      id-token: write
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      # setup-node only for the registry auth it writes into .npmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@ouijan"

      # A tag that disagrees with package.json would publish the wrong
      # version under the right-looking tag. Fail instead.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || {
            echo "tag $GITHUB_REF_NAME does not match package.json $pkg"
            exit 1
          }

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run compile

      # npm rather than bun: bun publish does not read setup-node's .npmrc.
      # --registry is explicit because package.json deliberately has no
      # publishConfig: that would override .npmrc and pin every publish here.
      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Packages requires a token even for public packages, so the
      # public registry is what makes `npm add` work with no setup.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@ouijan"

      # Trusted publishing needs npm >= 11.5.1; node 22 still bundles npm 10.
      - run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: the CLI detects the OIDC environment and
      # exchanges it for a short-lived credential.
      - name: Publish to npmjs via OIDC
        run: npm publish --access public --registry https://registry.npmjs.org
