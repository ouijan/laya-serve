name: CI

on:
  push:
    branches: [main]
  pull_request:

# Images are published only from main; pull requests build without pushing.
env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # A venv, not --system: the runner's Python is externally managed, and
      # it is 3.12 rather than the 3.13 mise.toml pins.
      - name: Install
        run: |
          uv venv --python 3.13
          uv pip install -e '.[dev]'

      # Includes the guard that clients/typescript/openapi.json matches the code.
      - name: Test
        run: uv run --no-sync pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: default
            suffix: cpu
          - target: baked
            suffix: cpu-baked
    steps:
      - uses: actions/checkout@v5

      # arm64 is emulated: free native arm64 runners are public-repo only.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ matrix.suffix }}
            type=sha,prefix=${{ matrix.suffix }}-

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
